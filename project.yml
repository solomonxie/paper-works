name: PaperWorksSwift
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Info.plist dict keys don't get $(...) expansion; the preprocessor fills in the bundle ID.
    INFOPLIST_PREPROCESS: YES
    INFOPLIST_PREPROCESSOR_DEFINITIONS: APP_BUNDLE_ID=$(PRODUCT_BUNDLE_IDENTIFIER)
packages:
  PaperWorksCore:
    path: Core
targets:
  PaperWorks:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - package: PaperWorksCore
      - sdk: libsqlite3.tbd
    entitlements:
      path: App/PaperWorks.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Paper Works
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppStoreRegion: $(APP_STORE_REGION)
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCalendarsFullAccessUsageDescription: "Only if you turn on Calendar export: start-by dates are written into a Paper Works calendar."
        NSCalendarsUsageDescription: "Only if you turn on Calendar export: start-by dates are written into a Paper Works calendar."
        NSRemindersFullAccessUsageDescription: "Only when you tap Export to Reminders: an event's steps are added to a list in Reminders."
        NSRemindersUsageDescription: "Only when you tap Export to Reminders: an event's steps are added to a list in Reminders."
        NSCameraUsageDescription: "Take a photo of a document to keep with the step that needs it."
        NSPhotoLibraryUsageDescription: "Pick a photo of a document to keep with the step that needs it."
        NSUbiquitousContainers:
          iCloud.APP_BUNDLE_ID:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Paper Works
            NSUbiquitousContainerSupportedFolderLevels: One
